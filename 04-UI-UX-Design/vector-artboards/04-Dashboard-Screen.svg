      <text x="590" y="78" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#0F172A">$12,450.00</text>
      <text x="590" y="110" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#065F46">↑ +18.4%</text>
      <text x="645" y="110" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">• Real-time Firestore</text>

      <!-- Card 4 -->
      <rect x="855" y="0" width="265" height="135" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="875" y="32" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748B">Low Stock Items</text>
      <rect x="1060" y="16" width="38" height="38" rx="8" fill="#FFF1F2" stroke="#FECDD3"/>
      <text x="875" y="78" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#E11D48">3</text>
      <text x="875" y="110" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#E11D48">Require replenishment</text>
