      <text x="790" y="105" font-family="monospace" font-size="10" fill="#64748B">SKU: ELE-3015 • Min: 20</text>
      <text x="1040" y="86" font-family="monospace" font-size="13" font-weight="700" fill="#E11D48">4 left</text>
      <text x="1040" y="104" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#2563EB">Restock →</text>

      <!-- Item 2 -->
      <rect x="775" y="135" width="325" height="64" rx="8" fill="#FFFBEB" stroke="#FDE68A"/>
