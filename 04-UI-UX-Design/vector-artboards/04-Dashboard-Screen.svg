      <text x="140" y="280" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Tue</text>
      <text x="250" y="280" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Wed</text>
      <text x="360" y="280" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Thu</text>
      <text x="470" y="280" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Fri</text>
      <text x="580" y="280" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Sat</text>
      <text x="670" y="280" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2563EB">Sun</text>

