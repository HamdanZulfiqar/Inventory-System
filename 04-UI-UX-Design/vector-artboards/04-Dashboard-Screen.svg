<svg width="1440" height="960" viewBox="0 0 1440 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Base Canvas -->
  <rect width="1440" height="960" fill="#F8FAFC"/>

  <!-- ================= SIDEBAR (256px) ================= -->
  <g id="Sidebar">
    <rect width="256" height="960" fill="#0F172A"/>
    
    <!-- Brand -->
    <rect x="20" y="16" width="36" height="36" rx="8" fill="#2563EB"/>
    <path d="M31 29L38 25L45 29L38 33L31 29Z" stroke="white" stroke-width="2"/>
    <text x="68" y="32" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">SmartInventory</text>
    <text x="68" y="46" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">Retail Store System</text>
    <line x1="0" y1="64" x2="256" y2="64" stroke="#1E293B"/>

    <!-- Role Tag -->
    <text x="24" y="90" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B" letter-spacing="0.05em">CURRENT ROLE</text>
    <rect x="160" y="78" width="72" height="20" rx="10" fill="#2E1065" stroke="#581C87"/>
    <text x="196" y="92" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#D8B4FE" text-anchor="middle">Admin</text>
    <line x1="0" y1="108" x2="256" y2="108" stroke="#1E293B"/>

    <!-- Nav Items -->
    <!-- Dashboard (Active) -->
    <rect x="12" y="120" width="232" height="40" rx="8" fill="#2563EB"/>
    <rect x="24" y="132" width="16" height="16" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <text x="52" y="145" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Dashboard</text>

    <!-- Products -->
    <text x="52" y="185" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Products</text>
    <!-- Inventory -->
    <text x="52" y="225" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Inventory &amp; Stock</text>
    <!-- Sales POS -->
    <text x="52" y="265" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Sales &amp; POS</text>
    <!-- Suppliers -->
    <text x="52" y="305" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Suppliers</text>
    <!-- Reports -->
    <text x="52" y="345" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Reports &amp; Analytics</text>

    <!-- Role Switcher Widget -->
    <g transform="translate(12, 820)">
      <rect width="232" height="110" rx="12" fill="#090D16" stroke="#1E293B"/>
      <text x="14" y="24" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#CBD5E1">Supervisor Role Switch</text>
      <text x="14" y="40" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Test role permissions directly:</text>
      
      <rect x="14" y="55" width="62" height="28" rx="6" fill="#2563EB"/>
      <text x="45" y="73" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Admin</text>

      <rect x="82" y="55" width="66" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="115" y="73" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">Inventory</text>

      <rect x="154" y="55" width="64" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="186" y="73" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" text-anchor="middle">Sales</text>
    </g>
