      <text x="1040" y="161" font-family="monospace" font-size="13" font-weight="700" fill="#E11D48">8 left</text>
      <text x="1040" y="179" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#2563EB">Restock →</text>

      <!-- Item 3 -->
      <rect x="775" y="210" width="325" height="64" rx="8" fill="#FFFBEB" stroke="#FDE68A"/>
      <text x="790" y="235" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Heavy Duty Packaging Tape (6-Pk)</text>
      <text x="790" y="255" font-family="monospace" font-size="10" fill="#64748B">SKU: SUP-4011 • Min: 30</text>
      <text x="1035" y="236" font-family="monospace" font-size="13" font-weight="700" fill="#D97706">25 left</text>
      <text x="1040" y="254" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#2563EB">Restock →</text>
    </g>

    <!-- Bottom Feeds (Recent Sales & Stock Movements) -->
    <g transform="translate(0, 565)">
      <!-- Sales Feed -->
      <rect x="0" y="0" width="550" height="260" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Recent Customer Sales</text>
      <text x="440" y="34" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2563EB">View All Sales →</text>

      <!-- Row 1 -->
      <line x1="24" y1="52" x2="526" y2="52" stroke="#F1F5F9"/>
      <text x="24" y="78" font-family="monospace" font-size="12" font-weight="700" fill="#2563EB">INV-2024-001</text>
      <text x="24" y="94" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">2 line items • Sold by Amina Patel</text>
      <text x="460" y="78" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A">$79.95</text>
      <text x="460" y="94" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94A3B8">2 hours ago</text>

      <!-- Row 2 -->
      <line x1="24" y1="110" x2="526" y2="110" stroke="#F1F5F9"/>
      <text x="24" y="136" font-family="monospace" font-size="12" font-weight="700" fill="#2563EB">INV-2024-002</text>
      <text x="24" y="152" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">1 line item • Sold by Sarah Connor</text>
      <text x="460" y="136" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A">$59.99</text>
      <text x="460" y="152" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94A3B8">Yesterday</text>

      <!-- Movements Feed -->
      <rect x="570" y="0" width="550" height="260" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="594" y="34" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Recent Stock Movements (Audit Trail)</text>
      <text x="1020" y="34" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2563EB">Audit Log →</text>

      <!-- Row 1 -->
      <line x1="594" y1="52" x2="1096" y2="52" stroke="#F1F5F9"/>
      <text x="594" y="78" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">Wireless Bluetooth Mouse</text>
      <text x="594" y="94" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Ref: PO-2024-008 • Received shipment</text>
      <rect x="1030" y="68" width="55" height="22" rx="4" fill="#ECFDF5"/>
      <text x="1057" y="83" font-family="monospace" font-size="11" font-weight="700" fill="#065F46" text-anchor="middle">+25</text>
