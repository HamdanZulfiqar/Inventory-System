    <!-- Firestore Status -->
    <rect x="760" y="18" width="140" height="28" rx="14" fill="#ECFDF5" stroke="#A7F3D0"/>
    <circle cx="776" cy="32" r="3.5" fill="#10B981"/>
    <text x="786" y="36" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#065F46">Firestore Connected</text>

    <!-- Alert Bell -->
    <rect x="915" y="16" width="36" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="933" cy="34" r="6" stroke="#475569" stroke-width="1.5"/>
    <circle cx="945" cy="22" r="8" fill="#E11D48"/>
    <text x="945" y="26" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

    <!-- Profile -->
    <g transform="translate(970, 14)">
      <circle cx="18" cy="18" r="18" fill="#DBEAFE"/>
      <text x="18" y="23" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#1D4ED8" text-anchor="middle">S</text>
      <text x="44" y="16" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Sarah Connor</text>
      <text x="44" y="30" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Admin</text>
    </g>
  </g>

  <!-- ================= MAIN CONTENT VIEWPORT ================= -->
  <g id="MainContent" transform="translate(288, 88)">
    <!-- Header Row -->
    <text x="0" y="24" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Retail Operations Overview</text>
    <text x="0" y="44" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">Real-time stock indicators, transaction records, and inventory metrics.</text>

    <!-- Quick Action CTAs -->
    <rect x="750" y="8" width="115" height="36" rx="8" fill="#2563EB"/>
    <text x="807" y="31" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Add Product</text>

    <rect x="875" y="8" width="110" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="930" y="31" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Point of Sale</text>

    <rect x="995" y="8" width="125" height="36" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="1057" y="31" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Stock Adjustment</text>

    <!-- 4 StatCards Row -->
    <g transform="translate(0, 70)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="265" height="135" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="20" y="32" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748B">Total Products</text>
      <rect x="205" y="16" width="38" height="38" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="20" y="78" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#0F172A">148</text>
      <text x="20" y="110" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#065F46">↑ +4 this week</text>
      <text x="98" y="110" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">• Active in catalogue</text>

      <!-- Card 2 -->
      <rect x="285" y="0" width="265" height="135" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="305" y="32" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748B">Active Suppliers</text>
      <rect x="490" y="16" width="38" height="38" rx="8" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text x="305" y="78" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#0F172A">12</text>
      <text x="305" y="110" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Verified trade vendors</text>

      <!-- Card 3 -->
      <rect x="570" y="0" width="265" height="135" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="590" y="32" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748B">Total Sales Value</text>
