<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Base Canvas -->
  <rect width="1440" height="900" fill="#F8FAFC"/>

  <!-- SIDEBAR (256px) -->
  <g id="Sidebar">
    <rect width="256" height="900" fill="#0F172A"/>
    <rect x="20" y="16" width="36" height="36" rx="8" fill="#2563EB"/>
    <text x="68" y="32" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">SmartInventory</text>
    <text x="68" y="46" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">Retail Store System</text>
    <line x1="0" y1="64" x2="256" y2="64" stroke="#1E293B"/>

    <text x="52" y="145" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Dashboard</text>

    <!-- Products (Active) -->
    <rect x="12" y="165" width="232" height="40" rx="8" fill="#2563EB"/>
    <text x="52" y="190" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Products</text>

    <text x="52" y="235" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Inventory &amp; Stock</text>
    <text x="52" y="275" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Sales &amp; POS</text>
    <text x="52" y="315" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Suppliers</text>
    <text x="52" y="355" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Reports &amp; Analytics</text>
  </g>

  <!-- TOP NAVBAR -->
  <g id="TopNavbar" transform="translate(256, 0)">
    <rect width="1184" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="32" y="38" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.05em">STORE MANAGEMENT CONSOLE / PRODUCTS</text>
    <rect x="915" y="16" width="36" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="933" cy="34" r="6" stroke="#475569" stroke-width="1.5"/>
    <circle cx="945" cy="22" r="8" fill="#E11D48"/>
    <text x="945" y="26" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  </g>

  <!-- MAIN CONTENT -->
  <g id="MainContent" transform="translate(288, 88)">
    <text x="0" y="24" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Product Catalogue Management</text>
    <text x="0" y="44" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">Maintain SKU definitions, category classifications, cost &amp; selling pricing, and reorder levels.</text>

    <!-- Create Button -->
    <rect x="955" y="8" width="165" height="38" rx="8" fill="#2563EB"/>
    <text x="1037" y="32" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Create New Product</text>

    <!-- Table Container -->
    <g transform="translate(0, 70)">
      <rect width="1120" height="680" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>

      <!-- Filter Bar -->
      <rect width="1120" height="60" rx="12" fill="#F8FAFC"/>
      <rect x="20" y="12" width="340" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="40" y="35" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94A3B8">Search by product name, SKU, category...</text>

      <rect x="740" y="12" width="160" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="755" y="35" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F172A">Category: All</text>

      <rect x="915" y="12" width="185" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="930" y="35" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F172A">Status: All Products</text>
      <line x1="0" y1="60" x2="1120" y2="60" stroke="#E2E8F0"/>

      <!-- Table Header -->
      <rect y="60" width="1120" height="40" fill="#F8FAFC"/>
      <text x="24" y="85" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">PRODUCT / SKU</text>
      <text x="320" y="85" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">CATEGORY</text>
      <text x="440" y="85" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="end">COST</text>
      <text x="530" y="85" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="end">SELL</text>
      <text x="610" y="85" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">STOCK</text>
      <text x="710" y="85" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">HEALTH</text>
      <text x="850" y="85" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">SUPPLIER</text>
      <text x="990" y="85" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">STATUS</text>
      <text x="1075" y="85" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="end">ACTIONS</text>
      <line x1="0" y1="100" x2="1120" y2="100" stroke="#E2E8F0"/>

      <!-- Row 1 -->
      <text x="24" y="130" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Wireless Bluetooth Ergonomic Mouse</text>
      <text x="24" y="146" font-family="monospace" font-size="11" fill="#64748B">ELE-1042</text>
      <rect x="320" y="125" width="80" height="22" rx="4" fill="#F1F5F9"/>
      <text x="360" y="140" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Electronics</text>
      <text x="440" y="136" font-family="monospace" font-size="12" fill="#64748B" text-anchor="end">$12.50</text>
      <text x="530" y="136" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A" text-anchor="end">$24.99</text>
      <text x="610" y="136" font-family="monospace" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">45</text>
      <!-- Health Pill -->
      <rect x="680" y="122" width="85" height="26" rx="13" fill="#ECFDF5" stroke="#A7F3D0"/>
      <text x="722" y="139" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#065F46" text-anchor="middle">In Stock</text>
      <text x="850" y="136" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">Global Hardware</text>
      <rect x="965" y="124" width="50" height="22" rx="4" fill="#ECFDF5"/>
      <text x="990" y="139" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#065F46" text-anchor="middle">Active</text>
      <text x="1075" y="136" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#2563EB" text-anchor="end">Edit</text>
      <line x1="0" y1="160" x2="1120" y2="160" stroke="#F1F5F9"/>

      <!-- Row 2 (Low Stock) -->
      <text x="24" y="190" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Mechanical Gaming Keyboard (Blue Switch)</text>
      <text x="24" y="206" font-family="monospace" font-size="11" fill="#64748B">ELE-2089</text>
      <rect x="320" y="185" width="80" height="22" rx="4" fill="#F1F5F9"/>
      <text x="360" y="200" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Electronics</text>
      <text x="440" y="196" font-family="monospace" font-size="12" fill="#64748B" text-anchor="end">$28.00</text>
      <text x="530" y="196" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A" text-anchor="end">$59.99</text>
      <text x="610" y="196" font-family="monospace" font-size="14" font-weight="700" fill="#D97706" text-anchor="middle">8</text>
      <!-- Health Pill -->
      <rect x="680" y="182" width="95" height="26" rx="13" fill="#FFFBEB" stroke="#FDE68A"/>
      <text x="727" y="199" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#92400E" text-anchor="middle">Low Stock</text>
      <text x="850" y="196" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">Global Hardware</text>
      <rect x="965" y="184" width="50" height="22" rx="4" fill="#ECFDF5"/>
      <text x="990" y="199" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#065F46" text-anchor="middle">Active</text>
      <text x="1075" y="196" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#2563EB" text-anchor="end">Edit</text>
      <line x1="0" y1="220" x2="1120" y2="220" stroke="#F1F5F9"/>

      <!-- Row 3 (Critical) -->
      <text x="24" y="250" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">USB-C Fast Charging Cable 2M</text>
      <text x="24" y="266" font-family="monospace" font-size="11" fill="#64748B">ELE-3015</text>
      <rect x="320" y="245" width="80" height="22" rx="4" fill="#F1F5F9"/>
      <text x="360" y="260" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Electronics</text>
      <text x="440" y="256" font-family="monospace" font-size="12" fill="#64748B" text-anchor="end">$3.40</text>
      <text x="530" y="256" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A" text-anchor="end">$9.99</text>
      <text x="610" y="256" font-family="monospace" font-size="14" font-weight="700" fill="#E11D48" text-anchor="middle">4</text>
      <!-- Health Pill -->
      <rect x="680" y="242" width="95" height="26" rx="13" fill="#FFF1F2" stroke="#FECDD3"/>
      <text x="727" y="259" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#9F1239" text-anchor="middle">Low Stock</text>
      <text x="850" y="256" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#334155">Global Hardware</text>
      <rect x="965" y="244" width="50" height="22" rx="4" fill="#ECFDF5"/>
      <text x="990" y="259" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#065F46" text-anchor="middle">Active</text>
      <text x="1075" y="256" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#2563EB" text-anchor="end">Edit</text>
      <line x1="0" y1="280" x2="1120" y2="280" stroke="#F1F5F9"/>
    </g>
  </g>
</svg>
