<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="900" fill="#F8FAFC"/>

  <!-- SIDEBAR (256px) -->
  <g id="Sidebar">
    <rect width="256" height="900" fill="#0F172A"/>
    <rect x="20" y="16" width="36" height="36" rx="8" fill="#2563EB"/>
    <text x="68" y="32" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">SmartInventory</text>
    <text x="68" y="46" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">Retail Store System</text>
    <line x1="0" y1="64" x2="256" y2="64" stroke="#1E293B"/>

    <text x="52" y="145" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Dashboard</text>
    <text x="52" y="185" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Products</text>
    <text x="52" y="225" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Inventory &amp; Stock</text>

    <!-- Sales POS (Active) -->
    <rect x="12" y="255" width="232" height="40" rx="8" fill="#2563EB"/>
    <text x="52" y="280" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Sales &amp; POS</text>

    <text x="52" y="325" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Suppliers</text>
    <text x="52" y="365" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Reports &amp; Analytics</text>
  </g>

  <!-- TOP NAVBAR -->
  <g id="TopNavbar" transform="translate(256, 0)">
    <rect width="1184" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="32" y="38" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.05em">STORE MANAGEMENT CONSOLE / POINT OF SALE</text>
  </g>

  <!-- MAIN CONTENT -->
  <g id="MainContent" transform="translate(288, 88)">
    <text x="0" y="24" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Point of Sale &amp; Transactions</text>
    <text x="0" y="44" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">Process retail customer sales with immediate stock decrement in Firestore.</text>

    <!-- Grid Split: 720px Left Cart / 380px Right Checkout -->
    <g transform="translate(0, 65)">
      <!-- Left: Item Selector & Cart -->
      <g>
        <!-- Selector Box -->
        <rect x="0" y="0" width="720" height="110" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="20" y="26" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">1. SELECT PRODUCT TO ADD</text>

        <rect x="20" y="40" width="440" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
        <text x="36" y="66" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0F172A">Wireless Bluetooth Mouse — $24.99 (45 in stock)</text>

        <rect x="475" y="40" width="70" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
        <text x="510" y="66" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle">2</text>

        <rect x="560" y="40" width="140" height="42" rx="8" fill="#2563EB"/>
        <text x="630" y="66" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Add to Sale</text>

        <!-- Cart Table Box -->
        <rect x="0" y="130" width="720" height="340" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
        <rect x="0" y="130" width="720" height="44" rx="12" fill="#F8FAFC"/>
        <text x="24" y="157" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">SALE LINE ITEMS (2)</text>
        <line x1="0" y1="174" x2="720" y2="174" stroke="#E2E8F0"/>

        <!-- Line 1 -->
        <text x="24" y="205" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Wireless Bluetooth Ergonomic Mouse</text>
        <text x="24" y="222" font-family="monospace" font-size="11" fill="#64748B">ELE-1042</text>
        <text x="380" y="210" font-family="monospace" font-size="12" fill="#64748B">$24.99</text>
        <rect x="460" y="195" width="45" height="28" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
        <text x="482" y="214" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">2</text>
        <text x="620" y="210" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A" text-anchor="end">$49.98</text>
        <text x="680" y="210" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#E11D48" text-anchor="middle">✕</text>
        <line x1="0" y1="235" x2="720" y2="235" stroke="#F1F5F9"/>

        <!-- Line 2 -->
        <text x="24" y="265" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">USB-C Fast Charging Cable 2M (Nylon Braided)</text>
        <text x="24" y="282" font-family="monospace" font-size="11" fill="#64748B">ELE-3015</text>
        <text x="380" y="270" font-family="monospace" font-size="12" fill="#64748B">$9.99</text>
        <rect x="460" y="255" width="45" height="28" rx="4" fill="#F1F5F9" stroke="#E2E8F0"/>
        <text x="482" y="274" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">3</text>
        <text x="620" y="270" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A" text-anchor="end">$29.97</text>
        <text x="680" y="270" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#E11D48" text-anchor="middle">✕</text>
        <line x1="0" y1="295" x2="720" y2="295" stroke="#F1F5F9"/>
      </g>

      <!-- Right: Checkout Box -->
      <g transform="translate(745, 0)">
        <rect width="375" height="470" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
        <text x="24" y="32" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#475569">2. CHECKOUT &amp; PAYMENT</text>
        <line x1="0" y1="48" x2="375" y2="48" stroke="#F1F5F9"/>

        <!-- Customer -->
        <text x="24" y="75" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Customer Name</text>
        <rect x="24" y="85" width="327" height="38" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
        <text x="36" y="109" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#0F172A">Walk-in Customer</text>

        <!-- Payment Method -->
        <text x="24" y="145" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155">Payment Method</text>
        <g transform="translate(24, 155)">
          <rect x="0" y="0" width="102" height="42" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
          <text x="51" y="26" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#2563EB" text-anchor="middle">💵 Cash</text>

          <rect x="112" y="0" width="102" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
          <text x="163" y="26" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">💳 Card</text>

          <rect x="224" y="0" width="102" height="42" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
          <text x="275" y="26" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B" text-anchor="middle">📱 Mobile</text>
        </g>

        <!-- Calculations -->
        <g transform="translate(24, 230)">
          <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">Subtotal</text>
          <text x="327" y="0" font-family="monospace" font-size="13" fill="#0F172A" text-anchor="end">$79.95</text>

          <text x="0" y="24" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">Tax (0%)</text>
          <text x="327" y="24" font-family="monospace" font-size="13" fill="#0F172A" text-anchor="end">$0.00</text>

          <line x1="0" y1="40" x2="327" y2="40" stroke="#E2E8F0"/>
          <text x="0" y="70" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Total Due</text>
          <text x="327" y="70" font-family="monospace" font-size="20" font-weight="700" fill="#2563EB" text-anchor="end">$79.95</text>
        </g>

        <!-- Complete Sale Button -->
        <rect x="24" y="340" width="327" height="48" rx="10" fill="#10B981"/>
        <text x="187" y="370" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓ Complete Sale ($79.95)</text>
        <text x="187" y="415" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Triggers atomic Firestore stock deduction</text>
      </g>
    </g>
  </g>
</svg>
