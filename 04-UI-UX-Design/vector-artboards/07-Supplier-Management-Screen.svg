<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="900" fill="#F8FAFC"/>

  <!-- SIDEBAR (256px) -->
  <g id="Sidebar">
    <rect width="256" height="900" fill="#0F172A"/>
    <rect x="20" y="16" width="36" height="36" rx="8" fill="#2563EB"/>
    <text x="68" y="32" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">SmartInventory</text>
    <text x="68" y="46" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">Retail Store System</text>
    <line x1="0" y1="64" x2="256" y2="64" stroke="#1E293B"/>

    <text x="52" y="145" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Dashboard</text>
    <text x="52" y="185" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Products</text>
    <text x="52" y="225" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Inventory &amp; Stock</text>
    <text x="52" y="265" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Sales &amp; POS</text>

    <!-- Suppliers (Active) -->
    <rect x="12" y="290" width="232" height="40" rx="8" fill="#2563EB"/>
    <text x="52" y="315" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Suppliers</text>

    <text x="52" y="365" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Reports &amp; Analytics</text>
  </g>

  <!-- TOP NAVBAR -->
  <g id="TopNavbar" transform="translate(256, 0)">
    <rect width="1184" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="32" y="38" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.05em">STORE MANAGEMENT CONSOLE / SUPPLIERS</text>
  </g>

  <!-- MAIN CONTENT -->
  <g id="MainContent" transform="translate(288, 88)">
    <text x="0" y="24" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Supplier Directory &amp; Contacts</text>
    <text x="0" y="44" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">Maintain authorized wholesale suppliers and their affiliated catalogue products.</text>

    <rect x="990" y="8" width="130" height="38" rx="8" fill="#2563EB"/>
    <text x="1055" y="32" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">+ Add Supplier</text>

    <!-- Search Input -->
    <rect x="0" y="65" width="340" height="38" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="16" y="89" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94A3B8">Search suppliers by name, email, location...</text>

    <!-- Card Grid -->
    <g transform="translate(0, 120)">
      <!-- Card 1 -->
      <rect x="0" y="0" width="355" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="20" y="20" width="44" height="44" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text x="240" y="44" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">3 products supplied</text>

      <text x="20" y="90" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Apex Wholesale Supplies</text>
      <text x="20" y="118" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">✉ orders@apexsupplies.com</text>
      <text x="20" y="138" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">☎ +1 (555) 234-5678</text>
      <text x="20" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">⚲ 142 Market Street, Industrial Park</text>
      
      <line x1="20" y1="180" x2="335" y2="180" stroke="#F1F5F9"/>
      <text x="20" y="202" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">Registered: Jan 15, 2024</text>
      <text x="335" y="202" font-family="monospace" font-size="11" fill="#64748B" text-anchor="end">sup-001</text>

      <!-- Card 2 -->
      <rect x="380" y="0" width="355" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="400" y="20" width="44" height="44" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text x="620" y="44" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">4 products supplied</text>

      <text x="400" y="90" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Global Hardware &amp; Electronics</text>
      <text x="400" y="118" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">✉ contact@globalelec.net</text>
      <text x="400" y="138" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">☎ +1 (555) 876-5432</text>
      <text x="400" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">⚲ 88 Tech Boulevard, Silicon Valley</text>
      
      <line x1="400" y1="180" x2="715" y2="180" stroke="#F1F5F9"/>
      <text x="400" y="202" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">Registered: Feb 01, 2024</text>
      <text x="715" y="202" font-family="monospace" font-size="11" fill="#64748B" text-anchor="end">sup-002</text>

      <!-- Card 3 -->
      <rect x="760" y="0" width="355" height="220" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="780" y="20" width="44" height="44" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
      <text x="1000" y="44" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B">2 products supplied</text>

      <text x="780" y="90" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#0F172A">Metro Retail Logistics</text>
      <text x="780" y="118" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">✉ support@metrologistics.com</text>
      <text x="780" y="138" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">☎ +1 (555) 345-9876</text>
      <text x="780" y="158" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">⚲ 500 Commerce Way, Bayonne, NJ</text>
      
      <line x1="780" y1="180" x2="1095" y2="180" stroke="#F1F5F9"/>
      <text x="780" y="202" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">Registered: Mar 10, 2024</text>
      <text x="1095" y="202" font-family="monospace" font-size="11" fill="#64748B" text-anchor="end">sup-003</text>
    </g>
  </g>
</svg>
