<svg width="1440" height="960" viewBox="0 0 1440 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="960" fill="#F8FAFC"/>

  <!-- SIDEBAR (256px) -->
  <g id="Sidebar">
    <rect width="256" height="960" fill="#0F172A"/>
    <rect x="20" y="16" width="36" height="36" rx="8" fill="#2563EB"/>
    <text x="68" y="32" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">SmartInventory</text>
    <text x="68" y="46" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">Retail Store System</text>
    <line x1="0" y1="64" x2="256" y2="64" stroke="#1E293B"/>

    <text x="52" y="145" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Dashboard</text>
    <text x="52" y="185" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Products</text>
    <text x="52" y="225" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Inventory &amp; Stock</text>
    <text x="52" y="265" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Sales &amp; POS</text>
    <text x="52" y="305" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Suppliers</text>

    <!-- Reports (Active) -->
    <rect x="12" y="330" width="232" height="40" rx="8" fill="#2563EB"/>
    <text x="52" y="355" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Reports &amp; Analytics</text>
  </g>

  <!-- TOP NAVBAR -->
  <g id="TopNavbar" transform="translate(256, 0)">
    <rect width="1184" height="64" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="32" y="38" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748B" letter-spacing="0.05em">STORE MANAGEMENT CONSOLE / ANALYTICS</text>
  </g>

  <!-- MAIN CONTENT -->
  <g id="MainContent" transform="translate(288, 88)">
    <text x="0" y="24" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#0F172A">Analytics &amp; Management Reports</text>
    <text x="0" y="44" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">Comprehensive financial valuation, best-selling product rankings, and inventory status.</text>

    <rect x="960" y="8" width="160" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="1040" y="32" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">🖶 Print Summary Report</text>

    <!-- 4 Financial Metric Cards -->
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="265" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="20" y="28" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">TOTAL SALES REVENUE</text>
      <text x="20" y="68" font-family="monospace" font-size="24" font-weight="700" fill="#0F172A">$12,450.00</text>
      <text x="20" y="96" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#065F46">Across 42 transactions</text>

      <rect x="285" y="0" width="265" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="305" y="28" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">INVENTORY COST VALUATION</text>
      <text x="305" y="68" font-family="monospace" font-size="24" font-weight="700" fill="#0F172A">$8,340.00</text>
      <text x="305" y="96" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Capital tied in 202 stock units</text>

      <rect x="570" y="0" width="265" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="590" y="28" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">RETAIL SALES POTENTIAL</text>
      <text x="590" y="68" font-family="monospace" font-size="24" font-weight="700" fill="#2563EB">$16,800.00</text>
      <text x="590" y="96" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">Valued at catalog selling prices</text>

      <rect x="855" y="0" width="265" height="120" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="875" y="28" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">PROJECTED GROSS PROFIT</text>
      <text x="875" y="68" font-family="monospace" font-size="24" font-weight="700" fill="#10B981">$8,460.00</text>
      <text x="875" y="96" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#065F46">Estimated Margin: 50.4%</text>
    </g>

    <!-- Visual Analytics: Bar Chart & Donut Chart -->
    <g transform="translate(0, 205)">
      <!-- Best Sellers (Horizontal Bar) -->
      <rect x="0" y="0" width="550" height="300" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="24" y="34" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Best-Selling Products by Units Sold</text>
      <text x="475" y="34" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#2563EB">Top 5</text>

      <!-- Bar 1 -->
      <text x="24" y="80" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F172A">USB-C Fast Cable</text>
      <rect x="180" y="66" width="300" height="20" rx="4" fill="#2563EB"/>
      <text x="495" y="81" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">25 units</text>

      <!-- Bar 2 -->
      <text x="24" y="125" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F172A">Ergonomic Mouse</text>
      <rect x="180" y="111" width="216" height="20" rx="4" fill="#3B82F6"/>
      <text x="410" y="126" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">18 units</text>

      <!-- Bar 3 -->
      <text x="24" y="170" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F172A">Receipt Paper (Box)</text>
      <rect x="180" y="156" width="168" height="20" rx="4" fill="#60A5FA"/>
      <text x="360" y="171" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">14 units</text>

      <!-- Bar 4 -->
      <text x="24" y="215" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F172A">Gaming Keyboard</text>
      <rect x="180" y="201" width="144" height="20" rx="4" fill="#93C5FD"/>
      <text x="336" y="216" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">12 units</text>

      <!-- Category Donut -->
      <rect x="570" y="0" width="550" height="300" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="594" y="34" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Inventory Distribution by Category</text>
      
      <!-- Donut Circle Simulation -->
      <circle cx="730" cy="165" r="70" stroke="#F1F5F9" stroke-width="26" fill="none"/>
      <circle cx="730" cy="165" r="70" stroke="#2563EB" stroke-width="26" stroke-dasharray="190 250" fill="none"/>
      <circle cx="730" cy="165" r="70" stroke="#10B981" stroke-width="26" stroke-dasharray="110 330" stroke-dashoffset="-190" fill="none"/>
      <circle cx="730" cy="165" r="70" stroke="#F59E0B" stroke-width="26" stroke-dasharray="80 360" stroke-dashoffset="-300" fill="none"/>
      <text x="730" y="165" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">202</text>
      <text x="730" y="180" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Total Units</text>

      <!-- Legend -->
      <g transform="translate(850, 100)">
        <rect x="0" y="0" width="12" height="12" rx="3" fill="#2563EB"/>
        <text x="22" y="11" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F172A">Electronics (45%)</text>

        <rect x="0" y="35" width="12" height="12" rx="3" fill="#10B981"/>
        <text x="22" y="46" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F172A">Packaging (30%)</text>

        <rect x="0" y="70" width="12" height="12" rx="3" fill="#F59E0B"/>
        <text x="22" y="81" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#0F172A">Office Supplies (25%)</text>
      </g>
    </g>

    <!-- Low Stock Table -->
    <g transform="translate(0, 525)">
      <rect width="1120" height="280" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect width="1120" height="44" rx="12" fill="#F8FAFC"/>
      <text x="24" y="28" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569">LOW-STOCK EXCEPTIONS &amp; REPLENISHMENT SUMMARY</text>
      <rect x="1010" y="10" width="90" height="24" rx="4" fill="#FFF1F2" stroke="#FECDD3"/>
      <text x="1055" y="26" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#9F1239" text-anchor="middle">3 items flagged</text>
      <line x1="0" y1="44" x2="1120" y2="44" stroke="#E2E8F0"/>

      <!-- Row 1 -->
      <text x="24" y="80" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">USB-C Fast Charging Cable 2M</text>
      <text x="320" y="80" font-family="monospace" font-size="11" fill="#64748B">ELE-3015</text>
      <text x="460" y="80" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">Electronics</text>
      <text x="640" y="80" font-family="monospace" font-size="13" font-weight="700" fill="#E11D48">4 left</text>
      <text x="780" y="80" font-family="monospace" font-size="12" fill="#64748B">Min: 20</text>
      <text x="1080" y="80" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A" text-anchor="end">$122.40 (36 units)</text>
      <line x1="0" y1="105" x2="1120" y2="105" stroke="#F1F5F9"/>

      <!-- Row 2 -->
      <text x="24" y="140" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">Mechanical Gaming Keyboard (Blue Switch)</text>
      <text x="320" y="140" font-family="monospace" font-size="11" fill="#64748B">ELE-2089</text>
      <text x="460" y="140" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">Electronics</text>
      <text x="640" y="140" font-family="monospace" font-size="13" font-weight="700" fill="#D97706">8 left</text>
      <text x="780" y="140" font-family="monospace" font-size="12" fill="#64748B">Min: 10</text>
      <text x="1080" y="140" font-family="monospace" font-size="13" font-weight="700" fill="#0F172A" text-anchor="end">$336.00 (12 units)</text>
      <line x1="0" y1="165" x2="1120" y2="165" stroke="#F1F5F9"/>
    </g>
  </g>
</svg>
